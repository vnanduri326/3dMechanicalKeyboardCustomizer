version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: keyboard_customizer_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: keyboard_customizer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keyboard_customizer_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # <-- This syncs your local backend files and migrations live
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/keyboard_customizer
    depends_on:
      - db

volumes:
  postgres_data: